- id: agent-default-model
  config:
    provider: tinker
    model: thinkingmachines/Inkling-Small:peft:262144

- id: llm-pi-ai
  config:
    providers:
      tinker:
        apiKeyEnv: TINKER_API_KEY
        api: openai-completions
        baseURL: https://tinker.thinkingmachines.dev/services/tinker-prod/oai/api/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: thinkingmachines/Inkling-Small:peft:262144
            contextWindow: 262144
            maxOutputTokens: 16384

- id: system-prompt
  config:
    personaPrefix: >-
      You are a skilled software engineer working in a sandboxed environment.
      You have access to a bash tool to execute commands. Complete the task
      described by the user.
    personaSuffix: ''

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-web
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-skill
  disabled: true
- insert:
    - id: hpc-sandbox-bash
      name: ./deepseek-bridge.mjs
